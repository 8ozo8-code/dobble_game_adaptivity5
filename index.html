<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 [무한 서바이벌] 도블 타임어택</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; text-align: center; background-color: #f8f9fa; margin: 0; padding: 20px; }
        .card-container { display: flex; justify-content: center; gap: 30px; margin: 20px 0; }
        .card { width: 280px; height: 280px; background-color: #F0F8FF; border: 5px solid #4682B4; border-radius: 50%; position: relative; }
        .item { position: absolute; font-weight: bold; }
        .progress-bar { width: 100%; max-width: 600px; height: 20px; background-color: #ddd; border-radius: 10px; margin: 0 auto 20px; overflow: hidden; }
        .progress-fill { height: 100%; background-color: #ff4757; width: 100%; }
        .overlay { display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 100; flex-direction: column; justify-content: center; align-items: center; }
        #message { font-size: 1.2rem; font-weight: bold; height: 30px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="main-title">🚀 [무한 서바이벌] 도블 타임어택</h1>
        <div class="stats">🎯 점수: <span id="score">0</span>점 | ❤️ <span id="hp">5</span></div>
        <div class="progress-bar"><div class="progress-fill" id="timer-bar"></div></div>
    </div>

    <div class="card-container">
        <div class="card" id="card1"></div>
        <div class="card" id="card2"></div>
    </div>

    <input type="text" id="answer-input" placeholder="정답 입력" disabled>
    <div id="message"></div>

    <div class="overlay" id="overlay">
        </div>

    <script>
        let timerInterval, wrongAnswerTimeout;
        let isInputLocked = false;

        // 게임 라운드 시작 함수
        function nextRound() {
            // 1. 모든 타이머 완전 초기화
            clearInterval(timerInterval);
            clearTimeout(wrongAnswerTimeout);
            
            // 2. 입력 및 상태 초기화
            isInputLocked = false;
            document.getElementById('message').innerText = "";
            document.getElementById('answer-input').value = "";
            document.getElementById('answer-input').disabled = false;
            
            if (hp <= 0) {
                gameOver();
                return;
            }

            // 3. 카드 렌더링 로직 (기존 로직 유지)
            renderCards(); 
            
            // 4. 타이머 다시 시작
            startTimer();
        }

        function startTimer() {
            let timeLeft = timeLimit;
            const bar = document.getElementById('timer-bar');
            
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                bar.style.width = `${(timeLeft / timeLimit) * 100}%`;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleWrongAnswer(`⏰ 시간 초과! 정답: ${expectedAnswerStr}`);
                }
            }, 100);
        }

        function handleWrongAnswer(msg) {
            if (isInputLocked) return; // 이미 처리 중이면 무시
            isInputLocked = true;
            
            clearInterval(timerInterval);
            hp--;
            updateStats();
            document.getElementById('message').innerText = msg;
            document.getElementById('message').style.color = '#ff4757';
            
            wrongAnswerTimeout = setTimeout(nextRound, 1500);
        }

        function submitAnswer(userVal) {
            if (isInputLocked) return;
            
            if (userVal === expectedAnswerStr) {
                clearInterval(timerInterval);
                score++;
                updateStats();
                document.getElementById('message').innerText = "✅ 정답!";
                document.getElementById('message').style.color = '#2ed573';
                setTimeout(nextRound, 500);
            } else {
                handleWrongAnswer(`❌ 틀렸습니다!`);
            }
        }

        function gameOver() {
            clearInterval(timerInterval);
            clearTimeout(wrongAnswerTimeout);
            document.getElementById('overlay').style.display = 'flex';
        }
    </script>
</body>
</html>
