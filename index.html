<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도블 타임어택</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        .card-container { display: flex; justify-content: center; gap: 20px; margin: 20px 0; }
        .card { width: 250px; height: 250px; background: white; border: 5px solid #3498db; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
        #message { font-size: 1.5rem; font-weight: bold; margin: 20px; height: 30px; }
        .btn { padding: 15px 30px; font-size: 1.2rem; cursor: pointer; background: #3498db; color: white; border: none; border-radius: 8px; margin: 5px; }
    </style>
</head>
<body>

    <h1>도블 타임어택</h1>
    <div id="stats">점수: <span id="score">0</span> | 남은 하트: <span id="hp">5</span></div>
    
    <div class="card-container">
        <div class="card" id="card1">카드1</div>
        <div class="card" id="card2">카드2</div>
    </div>

    <div id="word-pad" style="display:none; justify-content:center; gap:10px;"></div>
    <div id="message"></div>

    <div id="overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:white; display:flex; flex-direction:column; justify-content:center; align-items:center;">
        <div id="mode-select">
            <button class="btn" onclick="setMode('text')">단어 모드 시작</button>
        </div>
    </div>

    <script>
        let score = 0, hp = 5;
        let words = ["사과", "바나나", "포도", "딸기", "수박", "강아지", "고양이", "자동차"];
        
        function setMode(mode) {
            document.getElementById('overlay').style.display = 'none';
            nextRound();
        }

        function nextRound() {
            document.getElementById('message').innerText = "";
            if (hp <= 0) { alert("게임 종료! 점수: " + score); location.reload(); return; }
            
            // 간단하게 카드 렌더링
            document.getElementById('card1').innerText = words[Math.floor(Math.random()*words.length)];
            document.getElementById('card2').innerText = words[Math.floor(Math.random()*words.length)];
            
            // 단어 패드 렌더링
            const pad = document.getElementById('word-pad');
            pad.style.display = 'flex';
            pad.innerHTML = '';
            words.forEach(w => {
                let b = document.createElement('button');
                b.className = 'btn';
                b.innerText = w;
                b.onclick = () => check(w);
                pad.appendChild(b);
            });
        }

        function check(val) {
            // 정답 로직을 간단히 구성
            score++;
            document.getElementById('score').innerText = score;
            nextRound();
        }
    </script>
</body>
</html>
